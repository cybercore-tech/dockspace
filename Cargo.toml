[package]
name = "dockspace"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
dirs = "6.0.0"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Shared CYBERGRID theme documents/catalog and design tokens. The catalog API
# is newer than the published 0.6 crate, so pin its exact upstream commit
# until the next crates.io release.
cybercore = { git = "https://github.com/cybercore-tech/cybercore", rev = "614a5864cac14b43996e5fe7c003a93a8d5f1dad" }
