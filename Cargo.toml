[package]
name = "dockspace"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
dirs = "6.0.0"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# shared CYBERGRID palette + design tokens — same pattern as cyberdeck's
# `core` branch. Pinned to v0.4.0 (chunked theme files, 72 themes total —
# schema::load()'s API is unchanged from v0.3.1, this is a data-only bump).
cybercore = { git = "https://github.com/darkstardevx/cybercore.git", tag = "v0.4.0" }
